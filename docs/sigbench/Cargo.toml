# Standalone: not a member of the n42-rs workspace (pulls PQ crates the node does not need).
[workspace]

[package]
name = "sigbench"
version = "0.1.0"
edition = "2021"

[dependencies]
k256 = { version = "0.13", features = ["ecdsa", "schnorr", "arithmetic"] }
secp256k1 = { version = "0.30", features = ["recovery", "global-context", "rand"] }
p256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2.2", features = ["batch", "rand_core"] }
blst = "0.3"
sha2 = "0.10"
sha3 = "0.10"
rand = "0.8"
rand_core = "0.6"
rayon = "1"
fips204 = "0.4"
fips205 = "0.4"
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
