name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Run cargo check
      run: cargo check --verbose
    - name: Run tests
      # One test at a time: every test starts a node in this process, and 27
      # of them at once exhaust a hosted runner (the job lost its runner).
      run: cargo test -p n42-testing -- --test-threads=1
