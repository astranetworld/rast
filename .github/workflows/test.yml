name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI's test build: the tests pass or fail the same, and the
  # artifacts shrink by gigabytes on a runner that has few.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Free runner disk
      # A debug build of the workspace's dependency graph is ~30 GB of
      # artifacts; the hosted runner has ~14 GB free, and a runner that runs out
      # dies mid-step ("The operation was canceled" / "lost communication").
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force > /dev/null || true
        df -h /
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: stable
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
    - name: Run cargo check
      run: cargo check --verbose
    - name: Run tests
      # One test at a time: every test starts a node in this process, and 27
      # of them at once exhaust a hosted runner (the job lost its runner).
      # Locally, under a runner's 16 GB and 4 CPUs, every test takes 1-2 s and at
      # most 2.6 GB; a job that dies minutes into this step is out of disk or
      # memory in the build, which the step below reports.
      run: cargo test -p n42-testing -- --test-threads=1
    - name: Runner resources
      if: always()
      run: |
        df -h /
        free -g
        du -sh target 2>/dev/null || true
