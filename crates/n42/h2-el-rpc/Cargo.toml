[package]
name = "n42-h2-el-rpc"
version.workspace = true
edition.workspace = true
# Ported from ../N42-26 (rustc 1.97); see the note in the sibling h2 crates.
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Engine API client implementing the HotStuff-2 execution-layer seam over JSON-RPC"

[dependencies]
n42-h2-execution.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
# `jwt-aws-lc-rs`, not plain `jwt`: the bare feature pulls in jsonwebtoken
# without selecting a crypto provider, which compiles and then panics on the
# first token it signs. reth's own node-core requests the same feature.
alloy-rpc-types-engine = { workspace = true, features = ["jwt-aws-lc-rs", "serde"] }
alloy-rpc-types-eth = { workspace = true, features = ["serde"] }
async-trait = "0.1"
reqwest = { workspace = true, features = ["json", "rustls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
n42-h2-consensus.workspace = true
alloy-eip7928.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
alloy-eips = { workspace = true, features = ["serde"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
